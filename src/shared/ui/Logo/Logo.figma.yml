version: 1

# Figma (node 101:1156, single-variant set) -> React API adapter for Logo.

properties:
# The Figma set has a single variant ("Property 1=Default"): the wordmark
# vector. No variants map to props.

# Notes:
# - Pure-visual component: no router dependency; a Link wrapper belongs to
#   the integration change.
# - The SVG is exported from Figma (white wordmark fill, black contour
#   stroke, 3/3 hard drop shadow) and imported via the svgr `?react`
#   mechanism.
# - The logo is universal for both color themes — no light/dark pair.
# - The Figma export (mask + userSpaceOnUse filter) does not render on iOS
#   WebKit; the asset is re-drawn as plain paths in three layers: a black
#   silhouette offset (3,3) for the drop shadow, then black strokes
#   (stroke 6, fill none), then the white fills on a separate top layer.
#   Strokes and fills must stay separate — SVG paints a path's stroke over
#   its own fill, which would swallow the white letter fills. Visually
#   equivalent to the Figma mask, no mask/filter defs.
