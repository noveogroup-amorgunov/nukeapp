version: 1

# Figma (node 3:47) -> React API adapter for ProductCardV2.

properties:
  Availability:
    type: prop
    code:
      description: Derived from product data, not a runtime prop.
      values:
        Available: stock > 0
        LowStock: stock === 1 (renders the "Only 1 left" image badge)
        OutOfStock: stock === 0 (dimmed image, "out of stock" scrim,
          info block at 30% opacity, price line replaced with "Out of stock")

  Cart:
    type: prop
    code:
      description: Display-only overlay driven by the quantity prop. The
        card has no cart mutation controls and no add/remove callbacks —
        the Figma component shows none either.
      values:
        Empty: quantity === 0 or omitted
        Added: quantity > 0 (scrim + quantity numeral on the image)

  Actions:
    figma:
      type: slot
      layer: Actions
      position: absolute, image top-right corner (40x40, 8px padding,
        horizontal MAX / vertical MIN constraints)
    code:
      prop: actionSlot
      description: >
        ReactNode rendered over the image's top-right corner with 8px
        inset (e.g. IconButton + Icon type="like" for wishlist).

# Notes:
# - ProductCompactView mirrors the sibling project's shared/uikit/ProductCard
#   ontology. oldPrice stays in the view model but is not rendered (Figma
#   shows no old price).
# - Image area background is --color-bg-primary-pressed (visible while the
#   image loads and when imageUrl is null).
# - Cart quantity numeral is 36px Bold — no matching Text variant; styled in
#   the CSS module.
