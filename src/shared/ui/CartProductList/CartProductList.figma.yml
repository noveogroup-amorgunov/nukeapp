version: 1

# Figma (node 93:1823) -> React API adapter for CartProductList.

properties:
# The Figma component is a plain component (no variants): a vertical slot
# with a 12px gap of CartProductListCard instances. Its only content
# override is the set of cards.

# Notes:
# - Data contract: a list of CartLineView (a cart line: ProductCompactView +
#   Quantity) — decoupled from the entities layer, same precedent as the
#   ProductCard view model.
# - Stepper callbacks (onIncrease/onDecrease), onProductClick and the
#   `actions` render prop (filling each card's Actions slot) are hoisted to
#   the list level: integration attaches business behavior once per list.
# - Rendering is window-virtualized (@tanstack/react-virtual) with a 12px gap
#   and dynamic item measurement, because card heights vary with text wrap;
#   the Figma auto-layout gap maps to the virtualizer gap.
# - The list composes the internal CartProductCard; the card is not
#   exported from the shared UI barrel.
