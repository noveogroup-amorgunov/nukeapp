version: 1

# Figma (node 56:881) -> React API adapter for Text.

properties:
  Variant:
    type: prop
    prop: variant
    values:
      DisplayLarge: DisplayLarge
      DisplaySmall: DisplaySmall

  Color:
    type: prop
    prop: color
    values:
      --color-text-primary: primary
      --color-text-secondary: secondary

# Notes:
# - The Figma component set currently contains only DisplayLarge/DisplaySmall
#   variants; the code component covers all typography styles from the
#   Typography frame (LabelSmall, BodyMedium, BodyCapture, BodySmall).
# - Figma Color variant values are CSS token names; the code color prop takes
#   semantic names resolved through src/shared/ui/tokens.ts.
